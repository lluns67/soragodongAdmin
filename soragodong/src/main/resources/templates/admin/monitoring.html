<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>실시간 서버 모니터링</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="/assets/css/font-awesome.min.css">
    <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="stylesheet" href="/assets/css/responsive.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="main-content-inner">
    <a href="/admin/index2" class="btn btn-outline-secondary btn-sm">
        <i class="fa fa-home"></i> 대시보드로 돌아가기
    </a>
    <div class="row mt-5">
        <div class="col-md-3">
            <div class="card bg-primary text-white">
                <div class="card-body">
                    <h6>본 서버 상태</h6>
                    <h3 id="server-status">연결 중...</h3>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-success text-white">
                <div class="card-body">
                    <h6>실시간 접속자</h6>
                    <h3 id="active-users">0명</h3>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-info text-white">
                <div class="card-body">
                    <h6>CPU 사용량</h6>
                    <h3 id="cpu-usage">0%</h3>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-warning text-dark">
                <div class="card-body">
                    <h6>메모리 사용량</h6>
                    <h3 id="mem-usage">0%</h3>
                </div>
            </div>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <h4 class="header-title">시스템 리소스 변화 추이 (최근 1분)</h4>
                    <canvas id="resourceChart" style="width: 100%; height: 300px;"></canvas>
                </div>
            </div>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-12">
            <div class="card">
<!--                <div class="card-body">-->
<!--                    <h4 class="header-title">시스템 활동 로그</h4>-->
<!--                    <div class="table-responsive">-->
<!--                        <table class="table table-hover">-->
<!--                            <thead class="bg-light">-->
<!--                            <tr>-->
<!--                                <th>시간</th>-->
<!--                                <th>구분</th>-->
<!--                                <th>메시지</th>-->
<!--                                <th>응답시간</th>-->
<!--                            </tr>-->
<!--                            </thead>-->
<!--                            <tbody id="monitoring-log">-->
<!--                            </tbody>-->
<!--                        </table>-->
<!--                    </div>-->
<!--                </div>-->
            </div>
        </div>
    </div>
</div>

<script src="/assets/js/vendor/jquery-2.2.4.min.js"></script>
<script>
    // 차트 설정
    const ctx = document.getElementById('resourceChart').getContext('2d');
    const resourceChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [], // 시간 데이터
            datasets: [{
                label: 'CPU (%)',
                borderColor: 'rgb(54, 162, 235)',
                data: [],
                fill: false
            }, {
                label: 'Memory (%)',
                borderColor: 'rgb(255, 159, 64)',
                data: [],
                fill: false
            }]
        },
        options: {
            responsive: true,
            scales: { y: { beginAtZero: true, max: 100 } }
        }
    });

    // 데이터 업데이트 함수
    function fetchMonitoringData() {
        // 관리자 서버 내부의 중계 API 호출
        $.get('/admin/api/monitoring/stats', function(data) {
            const now = new Date().toLocaleTimeString();

            // 1. 상단 텍스트 업데이트
            $('#server-status').text(data.status);
            $('#active-users').text(data.activeUsers + '명');
            $('#cpu-usage').text(data.cpuUsage + '%');
            $('#mem-usage').text(data.memoryUsage + '%');

            // 2. 차트 데이터 추가
            if (resourceChart.data.labels.length > 20) {
                resourceChart.data.labels.shift();
                resourceChart.data.datasets[0].data.shift();
                resourceChart.data.datasets[1].data.shift();
            }
            resourceChart.data.labels.push(now);
            resourceChart.data.datasets[0].data.push(data.cpuUsage);
            resourceChart.data.datasets[1].data.push(data.memoryUsage);
            resourceChart.update();

<!--            // 3. 로그 추가-->
<!--            const logHtml = `<tr>-->
<!--                <td>${now}</td>-->
<!--                <td><span class="badge badge-success">INFO</span></td>-->
<!--                <td>Main Server Heartbeat - OK</td>-->
<!--                <td>${data.responseTime}ms</td>-->
<!--            </tr>`;-->
<!--            $('#monitoring-log').prepend(logHtml);-->
<!--            if($('#monitoring-log tr').length > 10) $('#monitoring-log tr:last').remove();-->
        });
    }

    // 3초마다 갱신
    setInterval(fetchMonitoringData, 3000);
</script>
</body>
</html>
