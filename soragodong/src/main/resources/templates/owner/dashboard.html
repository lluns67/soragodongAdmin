                                    <th>상품명</th>
                                    <th>정상가</th>

<script>
    function openEditModal(btn) {
    // 버튼의 data-* 속성에서 값을 읽어옴
    const num = $(btn).data('num');
    const name = $(btn).data('name');
    const price = $(btn).data('price');
    const ePrice = $(btn).data('eprice');
    const qty = $(btn).data('qty');
    const cat = $(btn).data('cat');
    const fileIdx = $(btn).data('img'); // DB의 file_idx 값

    // 모달 input에 세팅
    $('#editProductNum').val(num);
    $('#editProductName').val(name);
    $('#editPrice').val(price);
    $('#editEventPrice').val(ePrice);
    $('#editQuantity').val(qty);
    $('#editCategory').val(cat);

    // 현재 이미지 미리보기
     if(fileIdx) {
        // 경로가 아닌 /img/ID 형식을 사용합니다.
        $('#currentImageArea').html(`<img src="/img/${fileIdx}" style="width:100px; border-radius:5px;">`);
    } else {
        $('#currentImageArea').html('<span class="text-muted">이미지 없음</span>');
    }
    $('#editProductModal').modal('show');
}

/** * 커뮤니티 스타일의 파일 선택 및 미리보기 핸들러
 */
function handleFileSelect(input) {
    const files = Array.from(input.files);
    const container = document.getElementById('imageRow'); // 미리보기가 들어갈 부모 요소

    files.forEach(file => {
        if (file.type.startsWith('image/')) {
            // 브라우저 메모리에 임시 URL 생성 (서버 업로드 전 미리보기용)
            const tempUrl = URL.createObjectURL(file);

            const div = document.createElement('div');
            div.className = 'preview-box';
            div.style = "position: relative; width: 80px; height: 80px; margin-right: 10px;";

            // 커뮤니티 스타일의 이미지 태그 및 삭제 버튼 구성
            div.innerHTML = `
                <img src="${tempUrl}" style="width: 80px; height: 80px; object-fit: cover; border-radius: 5px;">
                <div class="btn-remove-img" onclick="this.parentElement.remove()"
                     style="position: absolute; top: -5px; right: -5px; cursor: pointer; background: red; color: white; border-radius: 50%; width: 20px; height: 20px; text-align: center; line-height: 20px;">
                    <i class="fa fa-close"></i>
                </div>
            `;
            container.appendChild(div);
        }
    });
}

function confirmDelete(productNum) {
    if (confirm("정말로 이 상품을 삭제하시겠습니까? 관련 이미지 파일도 함께 삭제됩니다.")) {
        const form = document.getElementById('deleteForm');
        form.action = '/owner/product/delete/' + productNum;
        form.submit();
    }
}
<!--좌표 위/경도-->

let map, marker;

// 모달이 완전히 열린 후 지도를 로드해야 깨지지 않습니다.
$('#editStoreModal').on('shown.bs.modal', function () {
    const initialLat = parseFloat($('#storeLat').val()) || 37.5665; // 기본값 서울
    const initialLng = parseFloat($('#storeLng').val()) || 126.9780;

    if (!map) {
        // 1. 지도 초기화
        map = L.map('map').setView([initialLat, initialLng], 15);

        // 2. 배경 지도 타일 설정 (OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // 3. 드래그 가능한 마커 추가
        marker = L.marker([initialLat, initialLng], {
            draggable: true
        }).addTo(map);

        // 마커 드래그 시 좌표 업데이트
        marker.on('dragend', function (e) {
            updateCoords(e.target.getLatLng());
        });

        // 지도 클릭 시 마커 이동 및 좌표 업데이트
        map.on('click', function (e) {
            marker.setLatLng(e.latlng);
            updateCoords(e.latlng);
        });
    } else {
        // 모달을 다시 열 때 위치 갱신
        map.invalidateSize();
        const latLng = new L.LatLng(initialLat, initialLng);
        map.setView(latLng, 15);
        marker.setLatLng(latLng);
    }
    // [추가 위치]: 모달이 열릴 때 위경도 값이 0이거나 비어있다면 주소를 기반으로 위치 찾기 실행
    if (!parseFloat($('#storeLat').val()) || parseFloat($('#storeLat').val()) === 0) {
        searchAddressToCoords();
    }
});

function updateCoords(latlng) {
    $('#storeLat').val(latlng.lat.toFixed(6));
    $('#storeLng').val(latlng.lng.toFixed(6));
}

/**
 * 입력된 주소를 좌표로 변환하여 지도와 마커를 이동시킵니다.
 */
function searchAddressToCoords() {
    const address = document.getElementById('storeAddress').value;
    if (!address) {
        alert("주소를 입력해주세요.");
        return;
    }

    // Nominatim API 사용 (무료 지오코딩 서비스)
    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`;

    fetch(url)
        .then(response => response.json())
        .then(data => {
            if (data && data.length > 0) {
                const lat = parseFloat(data[0].lat);
                const lon = parseFloat(data[0].lon);

                // 1. 지도 중심 이동
                map.setView([lat, lon], 16);

                // 2. 마커 위치 변경
                marker.setLatLng([lat, lon]);

                // 3. input 필드(위도, 경도) 값 업데이트
                updateCoords({ lat: lat, lng: lon });
            } else {
                alert("해당 주소의 좌표를 찾을 수 없습니다. 지도에서 직접 선택해주세요.");
            }
        })
        .catch(error => {
            console.error("지오코딩 에러:", error);
            alert("좌표 검색 중 오류가 발생했습니다.");
        });
}
