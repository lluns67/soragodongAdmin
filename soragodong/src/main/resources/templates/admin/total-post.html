<!DOCTYPE html>
<html xmlns:th="thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시물 관리</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" type="image/png" href="/assets/images/icon/favicon.ico">
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/css/font-awesome.min.css">
    <link rel="stylesheet" href="/assets/css/themify-icons.css">
    <link rel="stylesheet" href="/assets/css/metisMenu.css">
    <link rel="stylesheet" href="/assets/css/owl.carousel.min.css">
    <link rel="stylesheet" href="/assets/css/slicknav.min.css">
    <!-- amchart css -->
    <link rel="stylesheet" href="https://www.amcharts.com/lib/3/plugins/export/export.css" type="text/css" media="all" />
    <!-- others css -->
    <link rel="stylesheet" href="/assets/css/typography.css">
    <link rel="stylesheet" href="/assets/css/default-css.css">
    <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="stylesheet" href="/assets/css/responsive.css">
    <!-- modernizr css -->
    <script src="/assets/js/vendor/modernizr-2.8.3.min.js"></script>
    <script src="/assets/js/vendor/jquery-2.2.4.min.js"></script>
</head>
<body>
<div class="main-content-inner">
    <div class="row">
        <div class="col-12 mt-5">
            <div class="card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4 class="header-title mb-0">게시물 관리</h4>
                        <a href="/admin/index2" class="btn btn-outline-secondary btn-sm">
                            <i class="fa fa-home"></i> 대시보드로 돌아가기
                        </a>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-3">
                            <select class="custom-select" id="post-category-filter">
                                <option value="ALL" selected>모든 카테고리</option>

                                <option value="market">중고장터</option>
                                <option value="community">자유게시판</option>
                            </select>
                        </div>
                        <div class="col-md-7">
                            <input type="text" class="form-control" placeholder="제목, 내용 또는 작성자 검색..." id="post-search">
                        </div>
                        <div class="col-md-2">
                            <button class="btn btn-primary btn-block" id="btn-post-search">검색</button>
                        </div>
                    </div>

                    <div class="single-table">
                        <div class="table-responsive">
                            <table class="table table-hover text-center">
                                <thead class="text-uppercase bg-light">
                                <tr>
                                    <th scope="col">번호</th>
                                    <th scope="col">카테고리</th>
                                    <th scope="col">제목</th>
                                    <th scope="col">작성자</th>
                                    <th scope="col">작성일</th>
                                    <th scope="col">조회수</th>
                                    <th scope="col">추천</th>
                                    <th scope="col">상태</th>
                                    <th scope="col">관리</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="post : ${postList}">
                                    <td th:text="${post.idx}">번호</td>
                                    <td>
                                        <span class="badge"
                                              th:classappend="${post.type == '커뮤니티' ? 'badge-info' : 'badge-success'}"
                                              th:text="${post.type}">유형</span>
                                    </td>
                                    <td class="text-left" th:text="${post.title}">제목</td>
                                    <td th:text="${post.writer}">작성자</td>
                                    <td th:text="${#temporals.format(post.date, 'yyyy-MM-dd HH:mm')}">작성일</td>
                                    <td th:text="${post.views}">0</td>
                                    <td th:text="${post.likeCount}">0</td>
                                    <td>
                                        <span th:if="${post.isUse}" class="text-primary">게시 중</span>
                                        <span th:unless="${post.isUse}" class="text-danger">삭제됨</span>
                                    </td>
                                    <td>
                                        <ul class="d-flex justify-content-center">
                                            <li th:if="${post.isUse}" class="mr-2">
                                                <button class="btn btn-xs btn-outline-danger"
                                                        th:onclick="deletePost([[${post.idx}]], [[${post.type}]])">
                                                    <i class="fa fa-trash"></i> 삭제
                                                </button>
                                            </li>
                                            <li th:unless="${post.isUse}" class="mr-2">
                                                <button class="btn btn-xs btn-outline-success"
                                                        th:onclick="restorePost([[${post.idx}]], [[${post.type}]])">
                                                    <i class="fa fa-undo"></i> 복구
                                                </button>
                                            </li>
                                            <li>
                                                <button class="btn btn-xs btn-outline-info"
                                                        th:onclick="viewPostDetail([[${post.idx}]], [[${post.type}]])">
                                                    <i class="fa fa-search"></i> 상세
                                                </button>
                                            </li>
                                        </ul>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!--상세보기 모달-->
<div class="modal fade" id="postDetailModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modal-type-badge">게시물 상세 내용</h5>
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="font-weight-bold">제목</label>
                    <p id="modal-title" class="p-2 bg-light rounded"></p>
                </div>
                <div class="form-group">
                    <label class="font-weight-bold">내용</label>
                    <div id="image-container" class="text-center mb-3" style="display: none;">
                        <!-- JS에서 <img> 태그들이 동적으로 추가됩니다 -->
                    </div>
                    <div id="modal-content" class="p-3 border rounded" style="min-height: 200px; white-space: pre-wrap;"></div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <label class="font-weight-bold">작성자</label>
                        <p id="modal-writer"></p>
                    </div>
                    <div class="col-md-6 text-right">
                        <label class="font-weight-bold">조회수</label>
                        <p id="modal-views"></p>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">닫기</button>
            </div>
        </div>
    </div>
</div>
<script>
    // 삭제 및 복구 공통 처리 함수
    function processPostStatus(postId, postType, actionName) {
        if (confirm(`[${postType}] ${postId}번 게시물을 ${actionName}하시겠습니까?`)) {
            $.ajax({
                url: '/admin/api/post/toggle-status',
                method: 'POST',
                data: {
                    idx: postId,
                    type: postType
                },
                success: function(response) {
                    alert(`${actionName} 처리가 완료되었습니다.`);
                    location.reload(); // 화면 갱신
                },
                error: function(xhr) {
                    alert("처리 중 오류가 발생했습니다: " + xhr.responseText);
                }
            });
        }
    }

    // 기존 함수들을 위 공통 함수 호출로 변경
    function deletePost(postId, postType) {
        processPostStatus(postId, postType, "삭제");
    }

    function restorePost(postId, postType) {
        processPostStatus(postId, postType, "복구");
    }


    function viewPostDetail(postId, postType) {
    $.ajax({
        url: '/admin/api/post/detail',
        method: 'GET',
        data: {
            idx: postId,
            type: postType
        },
        success: function(data) {
            // 모달 데이터 세팅
            const badgeClass = (postType === '커뮤니티') ? 'badge-info' : 'badge-success';
            $('#modal-type-badge').html(`<span class="badge ${badgeClass}">${postType}</span> ${postId}번 상세 정보`);

            $('#modal-title').text(data.title);
            $('#modal-content').text(data.content);
            $('#modal-writer').text(data.writer);
            $('#modal-views').text(data.views + "회");
            
            // 기존 이미지들 비우기
            const $imgContainer = $('#image-container');
            $imgContainer.empty().hide();

            // 이미지 경로 리스트가 있고 데이터가 있는 경우 루프
            if (data.imagePaths && data.imagePaths.length > 0) {
                data.imagePaths.forEach(function(path) {
                    const imgTag = `<img src="${path}" alt="이미지" class="img-thumbnail mb-2" style="max-height: 500px; display: block; margin: 0 auto;">`;
                    $imgContainer.append(imgTag);
                });
                $imgContainer.show();
            }

            // 모달 띄우기
            $('#postDetailModal').modal('show');
        },
        error: function(xhr) {
            alert("내용을 불러오는 데 실패했습니다.");
        }
    });
}

    $(document).ready(function() {
    // 검색 버튼 클릭 이벤트
    $('#btn-post-search').on('click', function() {
        const type = $('#post-category-filter').val(); // ALL, 커뮤니티, 중고거래
        const searchWord = $('#post-search').val().trim();

        // 파라미터를 조립하여 페이지 이동
        let url = '/admin/total-post?';
        if (type !== 'ALL') url += 'targetType=' + encodeURIComponent(type) + '&';
        if (searchWord) url += 'searchWord=' + encodeURIComponent(searchWord);

        location.href = url;
    });

    // 엔터키 입력 시 검색 실행
    $('#post-search').on('keypress', function(e) {
        if (e.which === 13) {
            $('#btn-post-search').click();
        }
    });
});
</script>

</body>
</html>
