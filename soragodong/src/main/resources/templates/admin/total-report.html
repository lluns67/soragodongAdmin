<!doctype html>
<html class="no-js" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>신고 관리 - 소라고동</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" type="image/png" href="/assets/images/icon/favicon.ico">
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/css/font-awesome.min.css">
    <link rel="stylesheet" href="/assets/css/themify-icons.css">
    <link rel="stylesheet" href="/assets/css/metisMenu.css">
    <link rel="stylesheet" href="/assets/css/owl.carousel.min.css">
    <link rel="stylesheet" href="/assets/css/slicknav.min.css">
    <!-- amchart css -->
    <link rel="stylesheet" href="https://www.amcharts.com/lib/3/plugins/export/export.css" type="text/css" media="all" />
    <!-- others css -->
    <link rel="stylesheet" href="/assets/css/typography.css">
    <link rel="stylesheet" href="/assets/css/default-css.css">
    <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="stylesheet" href="/assets/css/responsive.css">
    <!-- modernizr css -->
    <script src="/assets/js/vendor/modernizr-2.8.3.min.js"></script>
</head>
<body>
<div class="page-container">
    <div class="main-content-inner">
        <div class="card mt-5">
            <div class="card-body">
                <h4 class="header-title">신고 내역 관리</h4>
                <div class="single-table">
                    <div class="table-responsive">
                        <table class="table table-hover text-center">
                            <thead class="text-uppercase bg-light">
                            <tr>
                                <th>번호</th>
                                <th>대상 유형</th>
                                <th>신고자</th>
                                <th>사유</th>
                                <th>상태</th>
                                <th>관리</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="report : ${reports}"
                                th:style="${report.status == 'PROCESSING' ? 'background-color: #fff9e6;' : ''}">
                                <td th:text="${report.reportIdx}">1</td>
                                <td>
                                    <span class="badge badge-secondary" th:text="${report.targetType}">BOARD</span>
                                    <small th:text="'(ID: ' + ${report.targetId} + ')'"></small>
                                    <a th:href="@{/admin/total-post(postIdx=${report.targetId}, targetType=${report.targetType})}"
                                       target="_blank"
                                       class="btn btn-xs btn-outline-primary ml-2">
                                        <i class="ti-search"></i> 게시물 확인
                                    </a>
                                </td>
                                <td th:text="${report.reporterIdx}">User9</td>
                                <td th:text="${report.reason}">부적절한 내용</td>
                                <td>
                                            <span th:class="${report.status == 'PROCESSING' ? 'status-p bg-warning' :
                                                            (report.status == 'APPROVED' ? 'status-p bg-success' : 'status-p bg-danger')}"
                                                  th:text="${report.status}">PROCESSING</span>
                                </td>
                                <td>
                                    <div th:if="${report.status == 'PROCESSING'}">
                                        <button type="button" class="btn btn-primary btn-xs mr-2"
                                                th:onclick="openProcessModal([[${report.reportIdx}]], 'APPROVED')">승인</button>
                                        <button type="button" class="btn btn-danger btn-xs"
                                                th:onclick="openProcessModal([[${report.reportIdx}]], 'REJECTED')">반려</button>
                                    </div>
                                    <span th:unless="${report.status == 'PROCESSING'}" class="text-muted">처리 완료</span>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="reportModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">신고 처리</h5>
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="modalReportIdx">
                <input type="hidden" id="modalStatus">
                <div class="form-group">
                    <label for="modalProcessNote">처리 결과 메시지 (사용자에게 발송됨)</label>
                    <textarea class="form-control" id="modalProcessNote" rows="5"
                              placeholder="신고자에게 전달할 처리 사유를 입력하세요."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">취소</button>
                <button type="button" class="btn btn-primary" onclick="submitReportProcess()">처리 확정</button>
            </div>
        </div>
    </div>
</div>

<script src="/assets/js/vendor/jquery-2.2.4.min.js"></script>
<script src="/assets/js/bootstrap.min.js"></script>
<script>
    // 모달 열기
    function openProcessModal(idx, status) {
        $('#modalReportIdx').val(idx);
        $('#modalStatus').val(status);
        $('#modalTitle').text(status === 'APPROVED' ? '신고 승인 및 처리' : '신고 반려 처리');
        $('#modalProcessNote').val(''); // 이전 입력값 초기화
        $('#reportModal').modal('show');
    }

    // 처리 결과 전송 (AJAX)
    function submitReportProcess() {
        const reportIdx = $('#modalReportIdx').val();
        const status = $('#modalStatus').val();
        const processNote = $('#modalProcessNote').val();

        if(!processNote.trim()) {
            alert("처리 사유를 입력해주세요.");
            return;
        }

        $.ajax({
            url: '/admin/report/process',
            type: 'POST',
            data: {
                reportIdx: reportIdx,
                status: status,
                processNote: processNote
            },
            success: function(res) {
                alert('처리가 완료되었습니다. 신고자에게 알림이 전송됩니다.');
                location.reload();
            },
            error: function(err) {
                alert('서버 통신 중 오류가 발생했습니다.');
            }
        });
    }
</script>
</body>
</html>
