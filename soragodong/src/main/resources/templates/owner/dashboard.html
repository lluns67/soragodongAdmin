<!DOCTYPE html>
<html xmlns:th="thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>점주 페이지</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" type="image/png" href="/assets/images/icon/favicon.ico">
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/css/font-awesome.min.css">
    <link rel="stylesheet" href="/assets/css/themify-icons.css">
    <link rel="stylesheet" href="/assets/css/metisMenu.css">
    <link rel="stylesheet" href="/assets/css/owl.carousel.min.css">
    <link rel="stylesheet" href="/assets/css/slicknav.min.css">
    <!-- amchart css -->
    <link rel="stylesheet" href="https://www.amcharts.com/lib/3/plugins/export/export.css" type="text/css" media="all" />
    <!-- others css -->
    <link rel="stylesheet" href="/assets/css/typography.css">
    <link rel="stylesheet" href="/assets/css/default-css.css">
    <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="stylesheet" href="/assets/css/responsive.css">
    <!-- modernizr css -->
    <script src="/assets/js/vendor/modernizr-2.8.3.min.js"></script>
</head>
<body>
<div class="main-content-inner">
    <div class="user-profile pull-right">
        <img class="avatar user-thumb" src="/assets/images/author/avatar.png" alt="avatar">
        <h4 class="user-name dropdown-toggle" data-toggle="dropdown">
            <span th:text="${#authentication.name}">Admin</span> <i class="fa fa-angle-down"></i>
        </h4>
        <div class="dropdown-menu">

            <a class="dropdown-item text-danger" href="/logout"><i class="ti-power-off"></i>로그아웃</a>
        </div>
    </div>

    <form th:action="@{/admin/logout}" method="post" id="logoutForm" style="display: none;">
    </form>
    <div class="row">
        <div class="col-lg-12 mt-5" th:if="${store != null}">
            <div class="card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4 class="header-title mb-0">내 점포: <span th:text="${store.storeName}" class="text-primary">가게이름</span></h4>
                        <button type="button"
                                class="btn btn-rounded btn-outline-info btn-sm"
                                data-toggle="modal"
                                data-target="#editStoreModal">
                            정보 수정
                        </button>
                    </div>
                    <div class="row">
                        <div class="col-md-3">
                            <img th:src="@{/uploads/{id}(id=${store.storePictureIdx})}" class="img-fluid rounded" alt="Store Image"
                                 th:if="${store.storePictureIdx != null}">
                            <div th:unless="${store.storePictureIdx != null}" class="bg-light d-flex align-items-center justify-content-center" style="height:200px;">
                                <span>이미지 없음</span>
                            </div>
                        </div>
                        <div class="col-md-9">
                            <table class="table">
                                <tr>
                                    <th>주소</th>
                                    <td th:text="${store.storeAddress}">서울시...</td>
                                    <th>상태</th>
                                    <td><span class="badge badge-success" th:text="${store.eventState}">정상</span></td>
                                </tr>
                                <tr>
                                    <th>영업 시간</th>
                                    <td><span th:text="${store.storeOpenTime}">09:00</span> ~ <span th:text="${store.storeCloseTime}">22:00</span></td>
                                    <th>이벤트 시간</th>
                                    <td><span th:text="${store.eventStartTime}">18:00</span> ~ <span th:text="${store.eventEndTime}">21:00</span></td>
                                </tr>
                                <tr>
                                    <th>이벤트 알림</th>
                                    <td colspan="3" th:text="${store.eventNote}" class="text-danger font-weight-bold">할인 중!</td>
                                </tr>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-12 mt-5" th:if="${store != null}">
            <div class="card">
                <div class="card-body">
                    <h4 class="header-title">판매 상품 관리</h4>
                    <div class="single-table">
                        <div class="table-responsive">
                            <table class="table table-hover text-center">
                                <thead class="bg-light text-uppercase">
                                <tr>
                                    <th>번호</th>
                                    <th>카테고리</th>
                                    <th>상품명</th>
                                    <th>정상가</th>
                                    <th>이벤트가</th>
                                    <th>재고</th>
                                    <th>관리</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="product : ${productList}">
                                    <td th:text="${product.productNum}">1</td>
                                    <td th:text="${product.category}">음식</td>
                                    <td class="text-left" th:text="${product.productName}">상품명</td>
                                    <td th:text="${#numbers.formatInteger(product.price, 0, 'COMMA')} + '원'">10,000</td>
                                    <td class="text-danger font-weight-bold"
                                        th:text="${#numbers.formatInteger(product.eventPrice, 0, 'COMMA')} + '원'">8,000</td>
                                    <td th:text="${product.productQuantity} + '개'">50</td>
                                    <td>
                                        <button class="btn btn-xs btn-outline-info"
                                                type="button"
                                                th:data-num="${product.productNum}"
                                                th:data-name="${product.productName}"
                                                th:data-price="${product.price}"
                                                th:data-eprice="${product.eventPrice}"
                                                th:data-qty="${product.productQuantity}"
                                                th:data-cat="${product.category}"
                                                th:data-img="${product.productPictureIdx}"
                                                onclick="openEditModal(this)">
                                            수정
                                        </button>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(productList)}">
                                    <td colspan="7">등록된 상품이 없습니다.</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="text-right mb-3">
    <button type="button" class="btn btn-primary btn-sm" data-toggle="modal" data-target="#productModal">
        <i class="fa fa-plus"></i> 새 상품 등록
    </button>
</div>

<div class="modal fade" id="productModal">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">신규 상품 등록</h5>
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
            </div>
            <form th:action="@{/owner/product/add}" method="post" enctype="multipart/form-data">
                <div class="modal-body">
                    <input type="hidden" name="storeIdx" th:value="${store.storeIdx}">
                    <input type="hidden" name="storeName" th:value="${store.storeName}">

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label>상품 카테고리</label>
                            <select name="category" class="form-control">
                                <option value="식사류">식사류</option>
                                <option value="안주류">안주류</option>
                                <option value="음료/주류">음료/주류</option>
                            </select>
                        </div>
                        <div class="form-group col-md-6">
                            <label>상품명</label>
                            <input type="text" name="productName" class="form-control" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-4">
                            <label>정상 가격 (원)</label>
                            <input type="number" name="price" class="form-control" required>
                        </div>
                        <div class="form-group col-md-4">
                            <label>이벤트 가격 (할인가)</label>
                            <input type="number" name="eventPrice" class="form-control">
                        </div>
                        <div class="form-group col-md-4">
                            <label>재고 수량</label>
                            <input type="number" name="productQuantity" class="form-control" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>상품 사진</label>
                        <input type="file" name="productPicture" class="form-control-file" multiple>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">취소</button>
                    <button type="submit" class="btn btn-primary">등록하기</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="editProductModal">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">상품 정보 수정</h5>
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
            </div>
            <form th:action="@{/owner/product/edit}" method="post" enctype="multipart/form-data">
                <div class="modal-body">
                    <input type="hidden" id="editProductNum" name="productNum">
                    <input type="hidden" name="storeIdx" th:value="${store.storeIdx}">

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label>상품명</label>
                            <input type="text" id="editProductName" name="productName" class="form-control" required>
                        </div>
                        <div class="form-group col-md-6">
                            <label>카테고리</label>
                            <select id="editCategory" name="category" class="form-control">
                                <option value="식사류">식사류</option>
                                <option value="안주류">안주류</option>
                                <option value="음료/주류">음료/주류</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-4">
                            <label>정상 가격 (원)</label>
                            <input type="number" id="editPrice" name="price" class="form-control" required>
                        </div>
                        <div class="form-group col-md-4">
                            <label>이벤트 가격</label>
                            <input type="number" id="editEventPrice" name="eventPrice" class="form-control">
                        </div>
                        <div class="form-group col-md-4">
                            <label>재고 수량</label>
                            <input type="number" id="editQuantity" name="productQuantity" class="form-control" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>현재 이미지</label>
                        <div id="currentImageArea" class="mb-2"></div>
                        <label>새 이미지 업로드 (변경 시에만 선택)</label>
                        <input type="file" name="productFiles" class="form-control-file" multiple>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">취소</button>
                    <button type="submit" class="btn btn-success">수정 완료</button>
                </div>
            </form>
        </div>
    </div>
</div>
<div class="modal fade" id="editStoreModal">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">상점 및 이벤트 설정 수정</h5>
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
            </div>
            <form th:action="@{/owner/store/edit}" method="post" enctype="multipart/form-data">
                <div class="modal-body">
                    <input type="hidden" name="storeIdx" th:value="${store.storeIdx}">

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label>상점명</label>
                            <input type="text" name="storeName" class="form-control" th:value="${store.storeName}" readonly>
                        </div>
                        <div class="form-group col-md-6">
                            <label>상점 주소</label>
                            <input type="text" name="storeAddress" class="form-control" th:value="${store.storeAddress}" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label>영업 시작</label>
                            <input type="time" name="storeOpenTime" class="form-control" th:value="${store.storeOpenTime}">
                        </div>
                        <div class="form-group col-md-6">
                            <label>영업 종료</label>
                            <input type="time" name="storeCloseTime" class="form-control" th:value="${store.storeCloseTime}">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="col-md-6 form-group">
                            <label>이벤트 시작 시간</label>
                            <input type="time" name="eventStartTime" class="form-control"
                                   th:value="${store.eventStartTime}">
                            <small class="text-muted">할인 혜택이 시작되는 시간입니다.</small>
                        </div>
                        <div class="col-md-6 form-group">
                            <label>이벤트 종료 시간</label>
                            <input type="time" name="eventEndTime" class="form-control"
                                   th:value="${store.eventEndTime}">
                            <small class="text-muted">할인 혜택이 종료되는 시간입니다.</small>
                        </div>
                    </div>

                    <hr>
                    <h6 class="mb-3 text-primary">SORA AI 이벤트 설정</h6>

                    <div class="form-group">
                        <label>SORA 브리핑 메시지 (eventNote)</label>
                        <textarea name="eventNote" class="form-control" rows="3" th:text="${store.eventNote}" placeholder="AI가 사용자에게 읽어줄 공지 내용을 적어주세요."></textarea>
                    </div>

                    <div class="form-group">
                        <label>상점 대표 사진</label>
                        <input type="file" name="storeFile" class="form-control-file">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">취소</button>
                    <button type="submit" class="btn btn-primary">변경사항 저장</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
    function openEditModal(btn) {
    // 버튼의 data-* 속성에서 값을 읽어옴
    const num = $(btn).data('num');
    const name = $(btn).data('name');
    const price = $(btn).data('price');
    const ePrice = $(btn).data('eprice');
    const qty = $(btn).data('qty');
    const cat = $(btn).data('cat');
    const img = $(btn).data('img');

    // 모달 input에 세팅
    $('#editProductNum').val(num);
    $('#editProductName').val(name);
    $('#editPrice').val(price);
    $('#editEventPrice').val(ePrice);
    $('#editQuantity').val(qty);
    $('#editCategory').val(cat);

    // 현재 이미지 미리보기
    if(img) {
        $('#currentImageArea').html(`<img src="/${img}" style="width:100px; border-radius:5px;">`);
    } else {
        $('#currentImageArea').html('<span class="text-muted">이미지 없음</span>');
    }

    $('#editProductModal').modal('show');
}
</script>
<script src="/assets/js/vendor/jquery-2.2.4.min.js"></script>
<!-- bootstrap 4 js -->
<script src="/assets/js/popper.min.js"></script>
<script src="/assets/js/bootstrap.min.js"></script>
<script src="/assets/js/owl.carousel.min.js"></script>
<script src="/assets/js/metisMenu.min.js"></script>
<script src="/assets/js/jquery.slimscroll.min.js"></script>
<script src="/assets/js/jquery.slicknav.min.js"></script>

<!-- start chart js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.7.2/Chart.min.js"></script>
<!-- start highcharts js -->
<script src="https://code.highcharts.com/highcharts.js"></script>
<!-- start zingchart js -->
<script src="https://cdn.zingchart.com/zingchart.min.js"></script>
<script>
    zingchart.MODULESDIR = "https://cdn.zingchart.com/modules/";
    ZC.LICENSE = ["569d52cefae586f634c54f86dc99e6a9", "ee6b7db5b51705a13dc2339db3edaf6d"];
</script>
<!-- all line chart activation -->
<script src="/assets/js/line-chart.js"></script>
<!-- all bar chart activation -->
<script src="/assets/js/bar-chart.js"></script>
<!-- all pie chart -->
<script src="/assets/js/pie-chart.js"></script>
<!-- others plugins -->
<script src="/assets/js/plugins.js"></script>
<script src="/assets/js/scripts.js"></script>
</body>
</html>
