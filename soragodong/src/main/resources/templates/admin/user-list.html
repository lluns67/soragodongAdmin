<!DOCTYPE html>
<html xmlns:th="thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>전체 가입자 목록</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/css/font-awesome.min.css">
    <link rel="stylesheet" href="/assets/css/themify-icons.css">
    <link rel="stylesheet" href="/assets/css/metisMenu.css">
    <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="stylesheet" href="/assets/css/responsive.css">
</head>
<body>

<div class="page-title-area">
    <div class="row align-items-center" style="padding: 20px 0;">
        <div class="col-sm-6">
            <div class="breadcrumbs-area clearfix">
                <h4 class="page-title pull-left">회원 관리</h4>
                <ul class="breadcrumbs pull-left">
                    <li><a href="/admin/index2">Home</a></li>
                    <li><span>전체 가입자 목록</span></li>
                </ul>
            </div>
        </div>
        <div class="col-sm-6 text-right">
            <a href="/admin/index2" class="btn btn-primary btn-sm">
                <i class="fa fa-home"></i> 대시보드로 돌아가기
            </a>
        </div>
    </div>
</div>

<div class="main-content-inner">
    <div class="row">
        <div class="col-12 mt-5">
            <div class="card">
                <div class="card-body">
                    <h4 class="header-title">전체 가입자 목록</h4>
                    <div class="single-table">
                        <div class="table-responsive">
                            <table class="table table-hover progress-table text-center">
                                <thead class="text-uppercase bg-light">
                                <tr>
                                    <th scope="col">IDX</th>
                                    <th scope="col">이메일</th>
                                    <th scope="col">이름(닉네임)</th>
                                    <th scope="col">거주지역</th>
                                    <th scope="col">계정생성일</th>
                                    <th scope="col">게시물 수</th>
                                    <th scope="col">매너온도</th>
                                    <th scope="col">경고</th>
                                    <th scope="col">상태</th>
                                    <th scope="col">설정</th>
                                </tr>
                                </thead>
                                <tbody id="user-list-body">
                                <tr th:each="user : ${userList}">
                                    <th scope="row" th:text="${user.userIdx}">1</th>
                                    <td th:text="${user.userEmail}">test@example.com</td>
                                    <td>
                                        <span th:text="${user.userName}">홍길동</span>
                                        (<span th:text="${user.userNickname}">길동이</span>)
                                    </td>
                                    <td th:text="${user.userAddress}">거주지</td>
                                    <td th:text="${user.createdAt}">계정 생성일</td>
                                    <td th:onclick="|location.href='/admin/total-post?userIdx=${user.userIdx}'|"
                                        style="cursor:pointer; color: #8914fe; font-weight: bold; text-decoration: underline;">
                                        <span th:text="${user.postCount}">0</span>개
                                    </td>
                                    <td th:text="${user.mannerScore}">36.5</td>
                                    <td>
                                        <span class="text-danger font-weight-bold" th:text="${user.warningCount}">0</span>회
                                    </td>
                                    <td>
                                        <span th:if="${user.isUse}" class="badge badge-success">활성</span>
                                        <span th:unless="${user.isUse}" class="badge badge-danger">정지</span>
                                    </td>
                                    <td>
                                        <ul class="d-flex justify-content-center">
                                            <li class="mr-3">
                                                <button class="btn btn-xs btn-outline-secondary"
                                                        th:onclick="editUser([[${user.userIdx}]], this)">수정</button>
                                            </li>
                                            <li>
                                                <button class="btn btn-xs btn-danger"
                                                        th:onclick="toggleStatus([[${user.userIdx}]])">상태변경</button>
                                            </li>
                                        </ul>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/assets/js/vendor/jquery-2.2.4.min.js"></script>
<script src="/assets/js/bootstrap.min.js"></script>
<script>
    $(document).ready(function() {
        // 1. 수정 버튼: 매너온도와 경고 횟수를 입력창으로 전환
        window.editUser = function(idx, btn) {
            const row = $(btn).closest('tr');

            // td 순서 (0:이메일, 1:닉네임, 2:지역, 3:생성일, 4:게시물수, 5:매너온도, 6:경고)
            const mannerCell = row.find('td').eq(5); // 매너온도 칸
            const warningCell = row.find('td').eq(6); // 경고 횟수 칸

            const currentManner = mannerCell.text().trim();
            const currentWarning = warningCell.find('span').text().trim();

            // 이미 입력창인 경우 중복 방지
            if (mannerCell.find('input').length > 0) return;

            // 매너온도 입력창으로 변경 (step 0.1 추가)
            mannerCell.html(`
                <input type="number" step="0.1" class="form-control form-control-sm d-inline-block text-center"
                       style="width: 70px;" value="${currentManner}" id="edit-manner-${idx}">
            `);

            // 경고 횟수 입력창으로 변경
            warningCell.html(`
                <input type="number" class="form-control form-control-sm d-inline-block text-center"
                       style="width: 60px;" value="${currentWarning}" id="edit-warning-${idx}"> 회
            `);

            // 버튼 텍스트 변경 및 함수 교체
            $(btn).text('저장').removeClass('btn-outline-secondary').addClass('btn-success')
                   .attr('onclick', `updateUserMetrics(${idx}, this)`);
        };

        // 2. 서버 저장 로직: 매너온도와 경고 횟수 동시 전송
        window.updateUserMetrics = function(idx, btn) {
            const mannerVal = $(`#edit-manner-${idx}`).val();
            const warningVal = $(`#edit-warning-${idx}`).val();

            $.ajax({
                url: '/admin/api/users/' + idx + '/metrics',
                method: 'PATCH',
                data: {
                    mannerScore: mannerVal,
                    warningCount: warningVal
                },
                success: function() {
                    alert("성공적으로 수정되었습니다.");
                    location.reload();
                },
                error: function() {
                    alert("수정에 실패했습니다.");
                }
            });
        };

        // 3. 상태변경 버튼: 활성/정지 토글
        window.toggleStatus = function(idx) {
            if(confirm(idx + "번 사용자의 활성/정지 상태를 변경하시겠습니까?")) {
                $.ajax({
                    url: '/admin/api/users/toggle-status',
                    method: 'POST',
                    data: { userIdx: idx },
                    success: function(res) {
                        alert("상태가 변경되었습니다.");
                        location.reload();
                    },
                    error: function(err) {
                        alert("처리 중 오류가 발생했습니다.");
                    }
                });
            }
        };
    }); // document.ready 닫기
</script>
</body>
</html>
