<head>
    <meta charset="UTF-8">
    <title>공지</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" type="image/png" href="/assets/images/icon/favicon.ico">
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/css/font-awesome.min.css">
    <link rel="stylesheet" href="/assets/css/themify-icons.css">
    <link rel="stylesheet" href="/assets/css/metisMenu.css">
    <link rel="stylesheet" href="/assets/css/owl.carousel.min.css">
    <link rel="stylesheet" href="/assets/css/slicknav.min.css">
    <!-- amchart css -->
    <link rel="stylesheet" href="https://www.amcharts.com/lib/3/plugins/export/export.css" type="text/css" media="all" />
    <!-- others css -->
    <link rel="stylesheet" href="/assets/css/typography.css">

<body>
<div class="main-content-inner">
    <div class="row">
        <div class="col-lg-12 mt-5">
            <div class="card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4 class="header-title mb-0">전체 공지사항 작성 및 발송</h4>
                        <a href="/admin/index2" class="btn btn-outline-secondary btn-sm">
                            <i class="fa fa-home"></i> 대시보드로 돌아가기
                        </a>
                    </div>

                    <form id="notice-form">
                        <div class="form-group">
                            <label for="notice-title" class="col-form-label">공지 제목</label>
                            <input class="form-control" type="text" id="notice-title" placeholder="공지사항 제목을 입력하세요 (예: [공지] 서버 점검 안내)">
                        </div>



                        <div class="form-group">
                            <label for="notice-content" class="col-form-label">공지 내용</label>
                            <textarea class="form-control" id="notice-content" rows="10" placeholder="상세한 공지 내용을 작성하세요."></textarea>
                            <label class="col-form-label">첨부 이미지 (최대 10장)</label>
                            <div class="image-attach-row" id="imageRow" style="display: flex; gap: 10px; flex-wrap: wrap;">
                                <div class="camera-btn" onclick="document.getElementById('fileInput').click()"
                                     style="width: 80px; height: 80px; border: 1px dashed #ddd; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; border-radius: 5px; background: #f9f9f9;">
                                    <i class="fa fa-camera" style="font-size: 24px; color: #888;"></i>
                                    <span id="imgCount" style="font-size: 12px; color: #888;">0/10</span>
                                </div>
                                <input type="file" id="fileInput" name="noticeFiles" style="display: none;"
                                       accept="image/*" multiple onchange="handleFileSelect(this)">
                            </div>

                        </div>




                        <div class="text-right mt-4">
                            <button type="button" class="btn btn-secondary mr-2" onclick="previewNotice()">미리보기</button>
                            <button type="button" class="btn btn-primary" onclick="sendNotice()">발송하기</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    // 파일 관리를 위한 전역 배열
let selectedFiles = [];

/**
 * 파일 선택 및 미리보기 렌더링
 */
function handleFileSelect(input) {
    const files = Array.from(input.files);

    if (selectedFiles.length + files.length > 10) {
        alert("사진은 최대 10장까지 첨부할 수 있습니다.");
        return;
    }

    files.forEach(file => {
        if (file.type.startsWith('image/')) {
            selectedFiles.push(file);

            // 미리보기 박스 생성 (커뮤니티 스타일)
            const tempUrl = URL.createObjectURL(file);
            const container = document.getElementById('imageRow');
            const div = document.createElement('div');
            div.className = 'preview-box';
            div.style = "position: relative; width: 80px; height: 80px;";
            div.innerHTML = `
                <img src="${tempUrl}" style="width: 80px; height: 80px; object-fit: cover; border-radius: 5px; border: 1px solid #ddd;">
                <div onclick="removeFile(this)"
                     style="position: absolute; top: -5px; right: -5px; background: #ff4747; color: white; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 12px;">
                    <i class="fa fa-close"></i>
                </div>
            `;
            container.appendChild(div);
        }
    });
    updateImageCount();
    input.value = ""; // 재선택 가능하도록 초기화
}

function removeFile(element) {
    const box = element.parentElement;
    const index = Array.from(box.parentElement.children).indexOf(box) - 1; // 카메라 버튼 제외 인덱스
    selectedFiles.splice(index, 1);
    box.remove();
    updateImageCount();
}

function updateImageCount() {
    document.getElementById('imgCount').innerText = `${selectedFiles.length}/10`;
}

/**
 * 공지사항 발송 (서버 전송)
 */
async function sendNotice() {
    const title = $('#notice-title').val();
    const content = $('#notice-content').val();

    if (!title || !content) {
        alert("제목과 내용을 모두 입력해 주세요.");
        return;
    }

    if (confirm("공지를 등록하시겠습니까?")) {
        const formData = new FormData();
        // NoticeDto 필드에 맞춰 데이터 추가
        formData.append("title", title);
        formData.append("content", content);

        // 선택된 파일들을 noticeFiles 이름으로 추가
        selectedFiles.forEach(file => {
            formData.append("noticeFiles", file);
        });

        try {
            const response = await fetch('/admin/notice/write', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                alert("공지가 성공적으로 등록되었습니다.");
                location.href = "/admin/notice/list"; // 리스트 페이지로 이동
            } else {
                alert("공지 등록 중 오류가 발생했습니다.");
            }
        } catch (error) {
            console.error("전송 에러:", error);
            alert("서버 통신 오류가 발생했습니다.");
        }
    }
}

// 미리보기 기능 (간단한 알럿이나 모달 활용)
function previewNotice() {
    const title = $('#notice-title').val();
    if (!title) {
        alert("제목을 입력해야 미리보기가 가능합니다.");
        return;
    }
    alert("[미리보기]\n제목: " + title + "\n\n작성된 내용이 사용자 앱/웹에 공지사항으로 등록됩니다.");
}
</script>
