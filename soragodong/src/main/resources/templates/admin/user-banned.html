<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>정지된 유저 관리</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/css/font-awesome.min.css">
    <link rel="stylesheet" href="/assets/css/themify-icons.css">
    <link rel="stylesheet" href="/assets/css/metisMenu.css">
    <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="stylesheet" href="/assets/css/responsive.css">
    <script src="/assets/js/vendor/modernizr-2.8.3.min.js"></script>
</head>
<body>

<div class="page-title-area">
    <div class="row align-items-center" style="padding: 20px 0;">
        <div class="col-sm-6">
            <div class="breadcrumbs-area clearfix">
                <h4 class="page-title pull-left">회원 관리</h4>
                <ul class="breadcrumbs pull-left">
                    <li><a href="/admin/index2">Home</a></li>
                    <li><span>정지된 유저</span></li>
                </ul>
            </div>
        </div>
        <div class="col-sm-6 text-right">
            <a href="/admin/index2" class="btn btn-primary btn-sm">
                <i class="fa fa-home"></i> 대시보드로 돌아가기
            </a>
        </div>
    </div>
</div>

<div class="main-content-inner">
    <div class="row">
        <div class="col-12 mt-5">
            <div class="card">
                <div class="card-body">
                    <h4 class="header-title">정지 회원 관리 내역</h4>
                    <div class="single-table">
                        <div class="table-responsive">
                            <table class="table table-hover text-center">
                                <thead class="text-uppercase bg-light">
                                <tr>
                                    <th>IDX</th>
                                    <th>이메일</th>
                                    <th>이름(닉네임)</th>
                                    <th>경고 횟수</th>
                                    <th>상태</th>
                                    <th>관리</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="user : ${userList}">
                                    <td th:text="${user.userIdx}">1</td>
                                    <td th:text="${user.userEmail}">test@test.com</td>
                                    <td>
                                        <span th:text="${user.userName}">이름</span>
                                        (<small th:text="${user.userNickname}">닉네임</small>)
                                    </td>
                                    <td>
                                        <span class="text-danger font-weight-bold" th:text="${user.warningCount}">0</span>회
                                    </td>
                                    <td><span class="badge badge-danger">정지됨</span></td>
                                    <td>
                                        <button class="btn btn-xs btn-outline-success"
                                                th:onclick="|restoreUser(${user.userIdx})|">
                                            <i class="fa fa-unlock"></i> 정지 해제
                                        </button>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(userList)}">
                                    <td colspan="6" class="p-5">정지된 사용자가 없습니다.</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function restoreUser(userIdx) {
        if(confirm(userIdx + "번 회원의 정지를 해제하시겠습니까?")) {
            $.ajax({
                url: '/admin/api/users/toggle-status',
                method: 'POST',
                data: { userIdx: userIdx },
                success: function() {
                    alert("정지가 해제되어 일반 회원으로 복구되었습니다.");
                    location.reload();
                },
                error: function() {
                    alert("처리 중 오류가 발생했습니다.");
                }
            });
        }
    }
</script>

<script src="/assets/js/vendor/jquery-2.2.4.min.js"></script>
<script src="/assets/js/bootstrap.min.js"></script>

</body>
</html>
